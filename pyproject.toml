[project]
name = "telegramegateway"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "zaoui yassine", email = "zaouiy59@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.162.2",
    "httpx>=0.28.1",
    "langchain>=1.4.9",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-postgres>=3.2.0",
    "ngrok>=1.7.0",
    "python-multipart>=0.0.33",
]

[project.scripts]
telegramegateway = "telegramegateway:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
